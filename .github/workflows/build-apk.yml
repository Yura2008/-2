name: Build Healther APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Healther repository
        uses: actions/checkout@v4
      - name: Verify and restore approved source
        shell: bash
        run: |
          echo '81bcae6a98c0cc3cad86772612103b32a814dc8d5bfb41bed00de5db87460142  payload/healther-source.tar.xz' | sha256sum --check --status
          tar -xJf payload/healther-source.tar.xz --strip-components=1
          test -f app/src/main/assets/screens/07_dashboard.html
          test -f app/src/main/assets/screens/dark_07_dashboard.html
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install platform and build tools
        run: |
          echo "Android SDK location: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check locked screens and JavaScript
        run: |
          python3 scripts/preflight.py
          node --check app/src/main/assets/healther-runtime.js
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check built APK contains reference assets
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -qx 'assets/screens/07_dashboard.html'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -qx 'assets/screens/dark_07_dashboard.html'
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Healther-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
