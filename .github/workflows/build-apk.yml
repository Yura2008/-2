name: Build Healther APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Healther repository
        uses: actions/checkout@v4
      - name: Verify and restore approved source
        shell: bash
        run: |
          echo '89c49b0115f1a2766c1c8db68aa2b79514d330087602d62cc7dd9a24fb13c72b  payload/healther-source.tar.xz' | sha256sum --check --status
          tar -xJf payload/healther-source.tar.xz --strip-components=1
          test -f app/src/main/assets/screens/07_dashboard.html
          test -f app/src/main/assets/screens/dark_07_dashboard.html
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check locked screens and JavaScript
        run: |
          python3 scripts/preflight.py
          node --check app/src/main/assets/healther-runtime.js
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check built APK contains reference assets
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -qx 'assets/screens/07_dashboard.html'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -qx 'assets/screens/dark_07_dashboard.html'
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Healther-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
